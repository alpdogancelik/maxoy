name: E2E Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  playwright:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maxoy
          POSTGRES_PASSWORD: maxoy
          POSTGRES_DB: maxoy_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Maxoy/package-lock.json

      - name: Install dependencies
        working-directory: Maxoy
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Maxoy
        run: npx playwright install --with-deps

      - name: Setup test database
        working-directory: Maxoy
        env:
          DATABASE_URL: postgresql://maxoy:maxoy@localhost:5432/maxoy_test
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed

      - name: Run Playwright tests
        working-directory: Maxoy
        env:
          DATABASE_URL: postgresql://maxoy:maxoy@localhost:5432/maxoy_test
          ADMIN_EMAIL: admin@maxoy.local
          ADMIN_PASSWORD: ChangeMe123!
        run: npm run test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: Maxoy/playwright-report/
          retention-days: 30

