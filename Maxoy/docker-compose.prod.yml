version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - ghcr.io/${GITHUB_REPOSITORY:-yourorg/maxoy}:latest
    image: ghcr.io/${GITHUB_REPOSITORY:-yourorg/maxoy}:${IMAGE_TAG:-latest}
    container_name: maxoy_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL:-}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - maxoy_network
    volumes:
      - media_uploads:/app/public/uploads

  db:
    image: postgres:16-alpine
    container_name: maxoy_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maxoy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-maxoy}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - maxoy_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maxoy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: maxoy_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - media_uploads:/var/www/uploads:ro
    depends_on:
      - app
    networks:
      - maxoy_network

volumes:
  postgres_data:
    driver: local
  media_uploads:
    driver: local

networks:
  maxoy_network:
    driver: bridge
